{% extends 'base.html' %}
{% block content %}
<section class="panel planner-shell">
  <div class="planner-heading">
    <div>
      <span class="tag">BƯỚC 1</span>
      <h1>Tạo kỳ thi mới</h1>
      <p class="muted">Planner sẽ phân bổ Lý thuyết, Luyện bài tập, Ôn lỗi sai, Làm đề và chữa lỗi theo thời gian còn lại.</p>
    </div>
  </div>

  <form method="post" class="planner-form" novalidate>
    <div class="form-grid">
      <label>Môn thi
        <input name="subject" required maxlength="160" placeholder="Ví dụ: Toán học">
      </label>
      <label>Ngày thi
        <input type="date" name="exam_date" min="{{ today }}" required>
      </label>
      <label>Điểm hiện tại
        <input type="number" name="current_score" min="0" max="10" step="0.1" required placeholder="0 - 10">
      </label>
      <label>Điểm mục tiêu
        <input type="number" name="target_score" min="0" max="10" step="0.1" required placeholder="0 - 10">
      </label>
      <label>Số phút học mỗi ngày
        <input type="number" name="daily_minutes" min="10" max="1440" step="1" required placeholder="Ví dụ: 60">
      </label>
    </div>
    <label>Danh sách chủ đề cần ôn <span class="muted">(mỗi dòng một chủ đề)</span>
      <textarea name="topics" rows="8" maxlength="20000" required placeholder="Hàm số
Hình học không gian
Xác suất"></textarea>
    </label>
    <div class="planner-actions">
      <a class="btn muted" href="{{ url_for('exam.planner_index') }}">Hủy</a>
      <button class="btn" type="submit">Tạo kế hoạch</button>
    </div>
  </form>
</section>
{% endblock %}
