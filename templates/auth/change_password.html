{% extends "base.html" %}

{% block title %}Đổi mật khẩu - Study Quest{% endblock %}

{% block content %}
<section class="panel">
  <p class="eyebrow">Bảo mật tài khoản</p>
  <h1>Đổi mật khẩu</h1>

  <form method="post" action="{{ url_for('change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <p>
      <label for="current_password">Mật khẩu hiện tại</label><br>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    </p>

    <p>
      <label for="new_password">Mật khẩu mới (ít nhất 12 ký tự)</label><br>
      <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
    </p>

    <p>
      <label for="confirm_password">Xác nhận mật khẩu mới</label><br>
      <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
    </p>

    <button class="btn" type="submit">Đổi mật khẩu</button>
  </form>
</section>
{% endblock %}
